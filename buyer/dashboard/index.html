<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aiccountant007 · Agentic Accounting & Escrow Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --buyer-color: #60a5fa;
      --seller-color: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .status-badge {
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #064e3b;
      color: var(--success);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge.live::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow: hidden;
    }
    .panel h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .deals-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .deal-card {
      background: #0f172a80;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .deal-card:hover, .deal-card.active {
      border-color: var(--primary);
    }
    .deal-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }
    .deal-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .events-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      padding-right: 8px;
    }
    .event-item {
      background: #0f172a60;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .event-item.actor-buyer { border-left-color: var(--buyer-color); }
    .event-item.actor-seller { border-left-color: var(--seller-color); }
    .event-item.type-verification_failed, .event-item.type-policy_blocked { border-left-color: var(--danger); }
    .event-item.type-verification_passed { border-left-color: var(--success); }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .event-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text);
    }
    .badge.simulated {
      background: #78350f;
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .badge.buyer { background: #1e3a8a; color: var(--buyer-color); }
    .badge.seller { background: #064e3b; color: var(--seller-color); }
    .event-msg {
      font-size: 0.95rem;
      color: var(--text);
      word-break: break-word;
    }
    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .tx-link {
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tx-link:hover { text-decoration: underline; }
    .btn-approve {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-approve:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>🛡️ Aiccountant007</span>
      <span style="font-size: 0.9rem; font-weight: normal; color: var(--text-muted);">Autonomous Auditing & Cardano Escrow</span>
    </h1>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button id="voice-toggle" onclick="toggleVoice()" style="background: #1e293b; border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 9999px; cursor: pointer; font-size: 0.85rem;">🔊 Voice: ON</button>
      <div class="status-badge live" id="connection-status">Live Connected</div>
    </div>
  </header>

  <div class="container">
    <div class="panel">
      <h2>Deals</h2>
      <div class="deals-list" id="deals-list">
        <div style="color: var(--text-muted); font-size: 0.9rem;">Waiting for transactions...</div>
      </div>
    </div>

    <div class="panel">
      <h2>Live Event Stream</h2>
      <div class="events-feed" id="events-feed"></div>
    </div>
  </div>

  <script>
    const eventsFeed = document.getElementById("events-feed");
    const dealsList = document.getElementById("deals-list");
    const connectionStatus = document.getElementById("connection-status");

    let voiceEnabled = true;
    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById("voice-toggle");
      btn.innerText = voiceEnabled ? "🔊 Voice: ON" : "🔈 Voice: OFF";
      btn.style.opacity = voiceEnabled ? "1" : "0.6";
    }

    const audioMap = {
      "escrow_locked": "/voice/03_hash_escrow.mp3",
      "verification_failed": "/voice/04_audit_dispute.mp3",
      "policy_blocked": "/voice/05_injection_defense.mp3",
      "payment_released": "/voice/06_honest_firm.mp3",
      "refund_authorized": "/voice/07_refund_settled.mp3",
      "refund_withdrawn": "/voice/07_refund_settled.mp3"
    };

    function playAudioForEvent(evType) {
      if (!voiceEnabled) return;
      const src = audioMap[evType];
      if (src) {
        try {
          const snd = new Audio(src);
          snd.volume = 0.7;
          snd.play().catch(e => console.log("Voice alert prevented:", e));
        } catch (e) {}
      }
    }

    const deals = new Map();
    let activeDealFilter = null;

    function renderDeals() {
      if (deals.size === 0) return;
      dealsList.innerHTML = "";

      const allBtn = document.createElement("div");
      allBtn.className = "deal-card" + (activeDealFilter === null ? " active" : "");
      allBtn.innerHTML = `
        <div class="deal-header"><span>All Deals</span><span>${deals.size}</span></div>
        <div class="deal-meta">Show all events feed</div>
      `;
      allBtn.onclick = () => { activeDealFilter = null; renderDeals(); filterEvents(); };
      dealsList.appendChild(allBtn);

      for (const [dealId, deal] of deals.entries()) {
        const card = document.createElement("div");
        card.className = "deal-card" + (activeDealFilter === dealId ? " active" : "");
        card.innerHTML = `
          <div class="deal-header">
            <span>#${dealId.slice(0, 8)}</span>
            <span style="font-size: 0.8rem; color: var(--text-muted);">${deal.events.length} ev</span>
          </div>
          <div class="deal-meta">${deal.lastMsg.slice(0, 45)}...</div>
        `;
        card.onclick = () => { activeDealFilter = dealId; renderDeals(); filterEvents(); };
        dealsList.appendChild(card);
      }
    }

    function filterEvents() {
      const items = eventsFeed.querySelectorAll(".event-item");
      items.forEach(item => {
        const dealId = item.dataset.dealId;
        if (!activeDealFilter || dealId === activeDealFilter) {
          item.style.display = "flex";
        } else {
          item.style.display = "none";
        }
      });
    }

    async function sendApproval(dealId, btn) {
      btn.disabled = true;
      btn.innerText = "Approving...";
      try {
        const res = await fetch(`/approve/${dealId}`, { method: "POST" });
        if (res.ok) {
          btn.innerText = "Approved ✓";
        } else {
          btn.innerText = "Error ✗";
        }
      } catch (err) {
        btn.innerText = "Error ✗";
      }
    }

    function addEvent(ev) {
      if (ev.deal_id) {
        if (!deals.has(ev.deal_id)) {
          deals.set(ev.deal_id, { events: [], lastMsg: ev.msg });
        }
        const d = deals.get(ev.deal_id);
        d.events.push(ev);
        d.lastMsg = ev.msg;
        renderDeals();
      }

      const item = document.createElement("div");
      item.className = `event-item actor-${ev.actor} type-${ev.type}`;
      item.dataset.dealId = ev.deal_id || "";

      if (activeDealFilter && ev.deal_id !== activeDealFilter) {
        item.style.display = "none";
      }

      const time = new Date(ev.ts).toLocaleTimeString();
      let badgesHtml = `<span class="badge ${ev.actor}">${ev.actor}</span>`;
      if (ev.simulated) {
        badgesHtml += `<span class="badge simulated">SIMULATED</span>`;
      }

      let footerHtml = "";
      if (ev.tx_url) {
        footerHtml += `<a class="tx-link" href="${ev.tx_url}" target="_blank">🔗 Blockchain Tx</a>`;
      }
      if (ev.type === "human_approval_required" && ev.deal_id) {
        footerHtml += `<button class="btn-approve" onclick="sendApproval('${ev.deal_id}', this)">Approve Payment</button>`;
      }

      item.innerHTML = `
        <div class="event-top">
          <div class="event-badges">${badgesHtml}</div>
          <span>${time}</span>
        </div>
        <div class="event-msg">${ev.msg}</div>
        ${footerHtml ? `<div class="event-footer">${footerHtml}</div>` : ""}
      `;

      eventsFeed.insertBefore(item, eventsFeed.firstChild);
      playAudioForEvent(ev.type);
    }

    const eventSource = new EventSource("/events");
    eventSource.onopen = () => {
      connectionStatus.innerText = "Live Connected";
      connectionStatus.className = "status-badge live";
    };
    eventSource.onerror = () => {
      connectionStatus.innerText = "Disconnected";
      connectionStatus.className = "status-badge";
    };

    // Listen to all standard and custom event types
    eventSource.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        addEvent(data);
      } catch (err) {
        console.error(err);
      }
    };

    // Generic handler for named event types
    const eventTypes = [
      "discovery_started", "offer_found", "seller_selected",
      "docs_hashed", "job_started", "policy_approved", "policy_blocked",
      "duplicate_blocked", "human_approval_required", "human_approved",
      "escrow_locked", "result_submitted", "payment_released",
      "refund_requested", "refund_authorized", "refund_withdrawn",
      "ocr_paid", "job_completed", "verification_passed", "verification_failed",
      "reputation_updated", "error"
    ];
    eventTypes.forEach(t => {
      eventSource.addEventListener(t, (e) => {
        try {
          addEvent(JSON.parse(e.data));
        } catch (err) {}
      });
    });
  </script>
</body>
</html>
