[project]
name = "aiccountant007"
version = "0.1.0"
description = "Client agent and accounting-firm agent trading through Masumi escrow"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "canonicaljson>=2.0",
]

[project.optional-dependencies]
agents = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "masumi",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["common*", "seller*", "buyer*"]

[tool.pytest.ini_options]
testpaths = ["tests", "seller", "buyer"]
pythonpath = ["."]
